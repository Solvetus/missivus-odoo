name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    container:
      image: odoo:19
      options: --user root
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Run Odoo test suite for missivus_mail_graph
        run: sh tools/run-tests.sh
        env:
          ADDONS_DIR: ${{ github.workspace }}
          DB_HOST: db
