[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B904"]

[tool.ruff.lint.isort]
known-first-party = ["odoo"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"**/__manifest__.py" = ["B018"]
